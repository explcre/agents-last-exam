<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#f7f8fa"/>

  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a">Where the data lives, and when</text>
  <text x="24" y="55" font-size="12.5" fill="#5b6673">The reference never exists on the machine the agent used. That is the whole security argument.</text>

  <!-- lane bands -->
  <rect x="24" y="76" width="852" height="150" rx="4" fill="#eef2f7" stroke="#d7dee7"/>
  <rect x="24" y="246" width="852" height="150" rx="4" fill="#fdf6ec" stroke="#ecd9bd"/>
  <text x="36" y="96" font-size="11" font-weight="700" fill="#2563eb" letter-spacing="1.2">HOST (repo)</text>
  <text x="36" y="266" font-size="11" font-weight="700" fill="#b45309" letter-spacing="1.2">TASK VM</text>

  <!-- phase headers -->
  <text x="150" y="424" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">1. start()</text>
  <text x="450" y="424" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">2. agent works</text>
  <text x="762" y="424" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">3. evaluate()</text>
  <text x="150" y="442" font-size="11" fill="#5b6673" text-anchor="middle">stage the visible inputs</text>
  <text x="450" y="442" font-size="11" fill="#5b6673" text-anchor="middle">reference absent from the VM</text>
  <text x="762" y="442" font-size="11" fill="#5b6673" text-anchor="middle">run, then compare host side</text>
  <line x1="300" y1="76" x2="300" y2="404" stroke="#cbd5e1" stroke-dasharray="3 4"/>
  <line x1="610" y1="76" x2="610" y2="404" stroke="#cbd5e1" stroke-dasharray="3 4"/>

  <!-- HOST: hidden reference, present throughout -->
  <rect x="44" y="108" width="240" height="100" rx="4" fill="#fff" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="60" y="130" font-size="12.5" font-weight="700" fill="#b91c1c">HIDDEN, host only</text>
  <text x="60" y="150" font-size="11.5" fill="#334155">data/reference/expected.json</text>
  <text x="60" y="168" font-size="11.5" fill="#334155">5 held-out replays</text>
  <text x="60" y="186" font-size="11.5" fill="#334155">gate hashes on unpublished ticks</text>
  <text x="60" y="202" font-size="10.5" fill="#94a3b8">never written to the VM</text>

  <!-- arrow: hidden reference persists across all phases -->
  <line x1="284" y1="158" x2="700" y2="158" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#redarrow)"/>
  <text x="470" y="150" font-size="10.5" fill="#b91c1c" text-anchor="middle">stays on the host for the entire run</text>

  <!-- HOST phase 3: grader -->
  <rect x="700" y="108" width="160" height="100" rx="4" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="716" y="130" font-size="12.5" font-weight="700" fill="#2563eb">grade.py</text>
  <text x="716" y="150" font-size="11.5" fill="#334155">gate: all 3 visible</text>
  <text x="716" y="167" font-size="11.5" fill="#334155">replays on ticks that</text>
  <text x="716" y="184" font-size="11.5" fill="#334155">were never published</text>
  <text x="716" y="201" font-size="11.5" fill="#334155">then score held-out</text>

  <!-- VM phase 1: staged input -->
  <rect x="44" y="282" width="240" height="96" rx="4" fill="#fff" stroke="#b45309"/>
  <text x="60" y="304" font-size="12.5" font-weight="700" fill="#b45309">input/ (visible)</text>
  <text x="60" y="323" font-size="11.5" fill="#334155">SPEC.md, starter/sim.py</text>
  <text x="60" y="340" font-size="11.5" fill="#334155">3 replays + their hashes</text>
  <text x="60" y="357" font-size="11.5" fill="#334155">trace_0.txt (every 25 ticks)</text>
  <text x="60" y="372" font-size="10.5" fill="#94a3b8">written inline, no image data</text>

  <!-- VM phase 2: agent -->
  <rect x="320" y="282" width="270" height="96" rx="4" fill="#fff" stroke="#b45309"/>
  <text x="336" y="304" font-size="12.5" font-weight="700" fill="#b45309">agent</text>
  <text x="336" y="324" font-size="11.5" fill="#334155">bisect the starter against the spec,</text>
  <text x="336" y="341" font-size="11.5" fill="#334155">find every deviation, then write</text>
  <text x="336" y="358" font-size="11.5" fill="#334155">output/sim.py</text>

  <!-- VM phase 3: run submission -->
  <rect x="630" y="282" width="230" height="96" rx="4" fill="#fff" stroke="#b45309"/>
  <text x="646" y="304" font-size="12.5" font-weight="700" fill="#b45309">eval_runner.py</text>
  <text x="646" y="324" font-size="11.5" fill="#334155">runs the submission on the</text>
  <text x="646" y="341" font-size="11.5" fill="#334155">5 held-out + 3 gate replays,</text>
  <text x="646" y="358" font-size="11.5" fill="#334155">returns stdout only</text>

  <!-- flow arrows -->
  <line x1="284" y1="330" x2="316" y2="330" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#gray)"/>
  <line x1="590" y1="330" x2="626" y2="330" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#gray)"/>

  <!-- replays down to VM at eval time (no hashes) -->
  <path d="M 736 208 L 736 240 L 748 240 L 748 278" fill="none" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#redarrow)"/>
  <text x="726" y="243" font-size="10.5" fill="#b91c1c" text-anchor="end">replays only, no hashes</text>

  <!-- stdout back up to host -->
  <path d="M 820 278 L 820 240 L 812 240 L 812 210" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#bluearrow)"/>
  <text x="832" y="245" font-size="10.5" fill="#2563eb">stdout</text>

  <defs>
    <marker id="gray" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#94a3b8"/>
    </marker>
    <marker id="redarrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b91c1c"/>
    </marker>
    <marker id="bluearrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#2563eb"/>
    </marker>
  </defs>
</svg>
